# All values below are ASSUMPTION unless noted otherwise — Favorita has no
# case-pack, safety-stock, or on-hand-inventory fields, so these cannot be
# derived from data. See DECISIONS.md and CONTEXT.md for why each is set
# the way it is.

case_pack: 12          # ASSUMPTION — one global value for every SKU (see DECISIONS.md 2026-09-22)
safety: 0               # ASSUMPTION — kept 0 so recommended cases are comparable to hindsight_demand_order
on_hand: 0              # Not an assumption — Favorita has no inventory field, so this is a data limitation

# Routine SKUs (every day of the past 28 fit in one case) are standing orders.
# model: fewer stockouts, more waste; last_week: the reverse. On stores 44/8,
# last_week pays only if a unit short costs < ~4.6 units wasted -- a
# BUSINESS SETTING for each store, not a tuned value (DECISIONS.md 2026-09-25).
routine_policy: model         # model | last_week

gate:
  # none = the redesign: every SKU gets an order and a likely range (confirmed
  # on store 8, DECISIONS.md 2026-09-25). case_straddle (v2) and rel_width (v1)
  # hand uncertain SKUs back as ASK ME; kept for the experiments and the UI's
  # history view.
  type: none                  # none | case_straddle | rel_width
  rel_width_threshold: 0.60   # opening position for the Section 7 sweep, not a derived value
  # Extended from the Problem Statement's 0.40-0.70: real rel_width has median ~0.77,
  # so that range never reached the ~15% abstain design point (DECISIONS.md 2026-09-24).
  sweep_thresholds: [0.60, 0.70, 0.85, 1.00, 1.20]

model:
  quantiles: [0.1, 0.5, 0.9]
  # sklearn GradientBoostingRegressor hyperparameters — starting defaults,
  # not tuned yet
  n_estimators: 100
  max_depth: 3
  learning_rate: 0.1
  random_state: 42

explain:
  model: "openai/gpt-4o-mini"
  temperature: 0
  max_tokens: 80

slice:
  store_nbr: 44
  density_threshold: 0.7
  first_test_item_nbr: 502331
